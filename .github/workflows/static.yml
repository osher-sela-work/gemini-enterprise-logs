# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # The sync function's URL comes from the SYNC_URL repository secret, not from the code
      - name: Insert the sync function's URL
        env:
          SYNC_URL: ${{ secrets.SYNC_URL }}
        run: |
          if [ -z "$SYNC_URL" ]; then echo "::error::The SYNC_URL repository secret isn't set."; exit 1; fi
          grep -q "__SYNC_URL__" index.html || { echo "::error::index.html has no __SYNC_URL__ placeholder."; exit 1; }
          sed -i "s|__SYNC_URL__|${SYNC_URL%/}|g" index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
